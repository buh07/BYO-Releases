name: Verify published one-line installs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published preview tag to verify
        required: true
        default: v0.1.10
        type: string

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: windows-x86_64
            runner: windows-2022
          - target: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out verification tooling and release tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install verification Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install with the published one-line command and check the runtime
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: python -B .github/scripts/verify_install.py

      - name: Retain exact commands, outputs and results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: one-line-install-${{ matrix.target }}-${{ inputs.tag }}
          path: install-evidence/
          if-no-files-found: warn
          retention-days: 90
